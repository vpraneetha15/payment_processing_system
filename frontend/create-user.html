<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Console | Create User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="create-user.css">
</head>
<body>
    <div class="bg-shape bg-shape-left" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-right" aria-hidden="true"></div>

    <header class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            <div>
                <p class="brand-kicker">Payments Processing System</p>
                <h1>Create User</h1>
            </div>
        </div>
        <nav class="top-links" aria-label="Primary">
            <a href="dashboard.html">Dashboard</a>
            <a href="create-payment.html">Create Payment</a>
            <a href="payment-history.html">Payment History</a>
        </nav>
    </header>

    <main class="layout">
        <section class="card card-form" aria-labelledby="form-title">
            <h2 id="form-title">User Onboarding Form</h2>

            <div class="system-values" aria-live="polite">
                <p><strong>Generated Account Number:</strong> <span id="generatedAccountNumber">-</span></p>
                <p><strong>Selected Opening Balance:</strong> <span id="generatedOpeningBalance">-</span></p>
            </div>

            <form id="createUserForm" novalidate>
                <div class="grid">
                    <label>
                        Full Name
                        <input type="text" id="fullName" name="fullName" placeholder="e.g., Alex Morgan" maxlength="80" required>
                        <small class="error" id="fullNameError"></small>
                    </label>

                    <label>
                        Email
                        <input type="email" id="email" name="email" placeholder="name@example.com" maxlength="120" required>
                        <small class="error" id="emailError"></small>
                    </label>

                    <label>
                        Opening Balance
                        <input type="number" id="openingBalance" name="openingBalance" placeholder="0.00" min="0" step="0.01" required>
                        <small class="error" id="openingBalanceError"></small>
                    </label>

                    <label>
                        Preferred Currency
                        <select id="preferredCurrency" name="preferredCurrency" required>
                            <option value="">Select currency</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="INR">INR</option>
                        </select>
                        <small class="error" id="preferredCurrencyError"></small>
                    </label>

                    <label class="grid-span-2">
                        Notes (Optional)
                        <textarea id="notes" name="notes" rows="4" maxlength="240" placeholder="Add context for access setup, shift timing, or responsibilities."></textarea>
                    </label>
                </div>

                <div class="switches">
                    <label class="switch-row">
                        <input type="checkbox" id="isActive" name="isActive" checked disabled>
                        <span>Active user (default on create)</span>
                    </label>
                </div>

                <label class="terms-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I confirm the details are accurate for system onboarding.</span>
                </label>
                <small class="error" id="termsError"></small>

                <div class="actions">
                    <button type="button" id="clearBtn" class="btn btn-ghost">Clear</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </section>

        <aside class="side-column">
            <section class="card">
                <h2>Live Preview</h2>
                <div class="preview" id="previewCard">
                    <p class="preview-name">New User</p>
                    <p class="preview-line">Account No: <span id="previewAccountNumber">-</span></p>
                    <p class="preview-line">Email: <span id="previewEmail">-</span></p>
                    <p class="preview-line">Currency: <span id="previewCurrency">-</span></p>
                    <p class="preview-line">Opening Balance: <span id="previewBalance">-</span></p>
                    <p class="preview-line">Status: <span id="previewStatus">Active</span></p>
                </div>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Recently Added Users</h2>
                    <button id="clearUsersBtn" class="btn-link" type="button">Refresh</button>
                </div>
                <ul id="userList" class="user-list" aria-live="polite"></ul>
            </section>
        </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <script>
            const apiBaseUrl = "http://localhost:8080";
            const accountPrefix = "ACC";
            const accountDigits = 3;

            const form = document.getElementById("createUserForm");
            const clearBtn = document.getElementById("clearBtn");
            const clearUsersBtn = document.getElementById("clearUsersBtn");
            const userList = document.getElementById("userList");
            const toast = document.getElementById("toast");
            const generatedAccountNumberEl = document.getElementById("generatedAccountNumber");
            const generatedOpeningBalanceEl = document.getElementById("generatedOpeningBalance");
            const submitBtn = form.querySelector("button[type='submit']");

            let currentGeneratedAccountNumber = "";
            let accountsCache = [];

            const fieldIds = ["fullName", "email", "openingBalance", "preferredCurrency", "terms"];

            const previewMap = {
                fullName: document.getElementById("previewCard").querySelector(".preview-name"),
                accountNumber: document.getElementById("previewAccountNumber"),
                email: document.getElementById("previewEmail"),
                preferredCurrency: document.getElementById("previewCurrency"),
                openingBalance: document.getElementById("previewBalance"),
                isActive: document.getElementById("previewStatus")
            };

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add("show");
                window.setTimeout(() => {
                    toast.classList.remove("show");
                }, 2200);
            }

            function setError(id, message) {
                const el = document.getElementById(`${id}Error`);
                if (el) {
                    el.textContent = message;
                }
            }

            function clearErrors() {
                fieldIds.forEach((id) => setError(id, ""));
            }

            function formatBalance(currency, amount) {
                if (!currency) {
                    return "-";
                }
                return `${currency} ${Number(amount).toFixed(2)}`;
            }

            function escapeHtml(text) {
                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };
                return String(text).replace(/[&<>"']/g, (char) => map[char]);
            }

            function getNextAccountNumber(accounts) {
                const maxFromAccounts = accounts.reduce((max, account) => {
                    const value = String(account.accountNumber || "").trim();
                    const pattern = new RegExp(`^${accountPrefix}(\\d{${accountDigits}})$`);
                    const match = value.match(pattern);
                    if (!match) {
                        return max;
                    }

                    const numeric = Number(match[1]);
                    return Number.isNaN(numeric) ? max : Math.max(max, numeric);
                }, 0);

                const nextNumber = maxFromAccounts + 1;
                return `${accountPrefix}${String(nextNumber).padStart(accountDigits, "0")}`;
            }

            function regenerateAccountNumber() {
                currentGeneratedAccountNumber = getNextAccountNumber(accountsCache);
                generatedAccountNumberEl.textContent = currentGeneratedAccountNumber;
            }

            function refreshPreview() {
                const fullName = document.getElementById("fullName").value.trim();
                const email = document.getElementById("email").value.trim();
                const preferredCurrency = document.getElementById("preferredCurrency").value;
                const balanceInput = document.getElementById("openingBalance").value;
                const balance = balanceInput === "" ? 0 : Number.parseFloat(balanceInput);
                const safeBalance = Number.isNaN(balance) ? 0 : balance;

                generatedOpeningBalanceEl.textContent = formatBalance(preferredCurrency, safeBalance);
                previewMap.fullName.textContent = fullName || "New User";
                previewMap.accountNumber.textContent = currentGeneratedAccountNumber || "-";
                previewMap.email.textContent = email || "-";
                previewMap.preferredCurrency.textContent = preferredCurrency || "-";
                previewMap.openingBalance.textContent = formatBalance(preferredCurrency, safeBalance);
                previewMap.isActive.textContent = "Active";
            }

            function renderUserList() {
                if (!accountsCache.length) {
                    userList.innerHTML = "<li>No users/accounts found in database yet.</li>";
                    return;
                }

                const latest = [...accountsCache].reverse().slice(0, 5);

                userList.innerHTML = latest
                    .map((account) => {
                        const badgeClass = account.active ? "badge" : "badge inactive";
                        const badgeText = account.active ? "Active" : "Inactive";

                        return `
                            <li>
                                <div class="line-1">
                                    <span>${escapeHtml(account.accountName)} (${escapeHtml(account.accountNumber)})</span>
                                    <span class="${badgeClass}">${badgeText}</span>
                                </div>
                                <div class="line-2">${escapeHtml(account.currency)} ${Number(account.balance).toFixed(2)}</div>
                            </li>
                        `;
                    })
                    .join("");
            }

            async function fetchAccounts() {
                const response = await fetch(`${apiBaseUrl}/accounts`);
                if (!response.ok) {
                    throw new Error(`Failed to load accounts (${response.status})`);
                }

                const data = await response.json();
                accountsCache = Array.isArray(data) ? data : [];
                regenerateAccountNumber();
                renderUserList();
                refreshPreview();
            }

            function formToRequestPayload() {
                const preferredCurrency = document.getElementById("preferredCurrency").value;
                const balanceValue = document.getElementById("openingBalance").value;
                const parsedBalance = Number.parseFloat(balanceValue || "0");

                return {
                    accountNumber: currentGeneratedAccountNumber,
                    accountName: document.getElementById("fullName").value.trim(),
                    balance: Number.isNaN(parsedBalance) ? 0 : parsedBalance,
                    currency: preferredCurrency,
                    active: true
                };
            }

            function validate(payload) {
                let isValid = true;

                if (!payload.accountName || payload.accountName.trim().length < 3) {
                    setError("fullName", "Enter at least 3 characters.");
                    isValid = false;
                }

                const email = document.getElementById("email").value.trim();
                if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
                    setError("email", "Enter a valid email address.");
                    isValid = false;
                }

                if (!payload.currency) {
                    setError("preferredCurrency", "Select preferred currency.");
                    isValid = false;
                }

                if (Number.isNaN(payload.balance) || payload.balance < 0) {
                    setError("openingBalance", "Enter a valid opening balance (0 or more).");
                    isValid = false;
                }

                const termsAccepted = document.getElementById("terms").checked;
                if (!termsAccepted) {
                    setError("terms", "Please confirm details before creating user.");
                    isValid = false;
                }

                return isValid;
            }

            function resetForm() {
                form.reset();
                document.getElementById("isActive").checked = true;
                clearErrors();
                refreshPreview();
            }

            async function createAccount(payload) {
                const response = await fetch(`${apiBaseUrl}/accounts`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `Create failed (${response.status})`);
                }
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                clearErrors();

                const payload = formToRequestPayload();
                if (!validate(payload)) {
                    showToast("Please fix form errors.");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Creating...";

                try {
                    await createAccount(payload);
                    await fetchAccounts();
                    resetForm();
                    showToast("User/account created and saved to database.");
                } catch (_error) {
                    await fetchAccounts().catch(() => {});
                    showToast("Create failed. Check backend/API and try again.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Create User";
                }
            });

            clearBtn.addEventListener("click", () => {
                resetForm();
                showToast("Form cleared.");
            });

            clearUsersBtn.addEventListener("click", async () => {
                try {
                    await fetchAccounts();
                    showToast("Refreshed from database.");
                } catch (_error) {
                    showToast("Could not refresh. Backend may be offline.");
                }
            });

            ["input", "change"].forEach((eventName) => {
                form.addEventListener(eventName, refreshPreview);
            });

            (async function init() {
                try {
                    await fetchAccounts();
                    showToast("Connected to backend.");
                } catch (_error) {
                    accountsCache = [];
                    regenerateAccountNumber();
                    renderUserList();
                    refreshPreview();
                    showToast("Backend offline. Start paymentsystem on port 8080.");
                }
            })();
        </script>
</body>
</html>
