<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History - Banking Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f8ff;
            --card: #ffffff;
            --line: #d8e5f4;
            --text: #10253b;
            --muted: #5f748e;
            --brand: #0d4e83;
            --success: #147d5f;
            --danger: #bb1d2e;
            --pending: #5f3dc4;
            --shadow: 0 14px 34px rgba(17, 40, 74, 0.09);
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 7%, rgba(13, 78, 131, 0.12) 0%, rgba(13, 78, 131, 0) 36%),
                radial-gradient(circle at 90% 0%, rgba(20, 125, 95, 0.1) 0%, rgba(20, 125, 95, 0) 33%),
                var(--bg);
            min-height: 100vh;
        }

        .page {
            width: min(1280px, 94%);
            margin: 26px auto 36px;
        }

        .hero {
            background: linear-gradient(126deg, #0d4e83, #1d7fc4);
            color: #fff;
            border-radius: calc(var(--radius) + 6px);
            padding: 26px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -50px;
            top: -56px;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 2.7vw, 2.2rem);
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .hero p {
            margin: 8px 0 0;
            position: relative;
            z-index: 1;
            opacity: 0.96;
        }

        .hero-meta {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            position: relative;
            z-index: 1;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #7bf5b3;
            box-shadow: 0 0 0 0 rgba(123, 245, 179, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(123, 245, 179, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(123, 245, 179, 0); }
            100% { box-shadow: 0 0 0 0 rgba(123, 245, 179, 0); }
        }

        .cards {
            margin: 16px 0;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 6px 14px rgba(17, 34, 58, 0.06);
            padding: 12px;
        }

        .card .k {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            font-weight: 700;
        }

        .card .v {
            margin-top: 4px;
            font-weight: 800;
            font-size: 1.24rem;
        }

        .toolbar {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr 220px auto auto;
            gap: 10px;
            align-items: center;
            box-shadow: 0 6px 14px rgba(17, 34, 58, 0.06);
            margin-bottom: 14px;
        }

        .search,
        .select,
        .btn {
            min-height: 42px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.93rem;
        }

        .search,
        .select {
            border: 1px solid var(--line);
            padding: 0 10px;
        }

        .btn {
            border: none;
            cursor: pointer;
            color: #fff;
            background: var(--brand);
            padding: 0 14px;
            font-weight: 700;
            transition: transform 0.16s ease;
        }

        .btn.secondary { background: #355b81; }
        .btn:hover { transform: translateY(-1px); }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel h2 {
            margin: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .table-wrap {
            overflow: auto;
            max-height: 76vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
        }

        th,
        td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2fa;
            font-size: 0.88rem;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f8fbff;
            color: #466385;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.74rem;
        }

        .summary-row { cursor: pointer; }
        .summary-row:hover { background: #f8fbff; }

        .summary-row.selected {
            background: #ecf5ff;
            box-shadow: inset 3px 0 0 var(--brand);
        }

        .summary-row.updated { animation: flash 1.4s ease; }

        @keyframes flash {
            0% { background: #d9ecff; }
            100% { background: transparent; }
        }

        .detail-row { background: #fcfeff; }
        .detail-cell { padding: 0; }

        .detail-box {
            border-top: 1px solid #dce9f7;
            padding: 14px;
            display: grid;
            gap: 12px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .kv {
            border: 1px solid #e5eef9;
            border-radius: 10px;
            padding: 8px 10px;
            background: #fff;
        }

        .kv .k {
            font-size: 0.71rem;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
        }

        .kv .v {
            margin-top: 3px;
            font-weight: 700;
            font-size: 0.86rem;
        }

        .failed-box {
            border: 1px solid #ffd5d9;
            background: #fff4f5;
            border-radius: 12px;
            padding: 10px;
        }

        .failed-box h3 {
            margin: 0 0 6px;
            color: #982030;
            font-size: 0.83rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .timeline {
            margin: 0;
            padding: 0 0 0 26px;
            list-style: none;
            position: relative;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 6px;
            bottom: 12px;
            width: 2px;
            background: linear-gradient(#d2dfef, #b9cbdf);
        }

        .event {
            position: relative;
            padding: 0 0 12px 14px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: absolute;
            left: -1px;
            top: 5px;
            border: 2px solid #fff;
            box-shadow: 0 0 0 3px #e7f1ff;
            background: #4a6281;
        }

        .dot.created,
        .dot.initiated { background: #2e6ea9; }
        .dot.processing,
        .dot.pending { background: var(--pending); }
        .dot.completed,
        .dot.success { background: var(--success); }
        .dot.failed,
        .dot.cancelled,
        .dot.error { background: var(--danger); }

        .event-head {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 7px;
        }

        .event .state {
            font-weight: 800;
            font-size: 0.86rem;
        }

        .event .stamp {
            color: var(--muted);
            font-size: 0.79rem;
        }

        .event .duration {
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            background: #edf4ff;
            color: #2b4f74;
            padding: 4px 8px;
            white-space: nowrap;
        }

        .meta {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill {
            border: 1px solid #d7e5f7;
            border-radius: 999px;
            font-size: 0.72rem;
            padding: 3px 7px;
            color: #32597f;
            background: #f3f8ff;
        }

        .note,
        .error {
            margin-top: 7px;
            border-radius: 9px;
            padding: 8px 9px;
            font-size: 0.82rem;
            line-height: 1.35;
        }

        .note {
            border: 1px solid #dae8f8;
            background: #f8fbff;
            color: #264667;
        }

        .error {
            border: 1px solid #ffd5d9;
            background: #fff5f6;
            color: #8e1d26;
        }

        .transition {
            margin-top: 6px;
            display: inline-flex;
            gap: 7px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #5b7390;
            align-items: center;
        }

        .arrow {
            width: 15px;
            height: 2px;
            background: #8ea3bb;
            position: relative;
            display: inline-block;
        }

        .arrow::after {
            content: "";
            position: absolute;
            right: -1px;
            top: -3px;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 6px solid #8ea3bb;
        }

        .id {
            max-width: 240px;
            word-break: break-all;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            color: #2b4a70;
        }

        .status-chip {
            display: inline-block;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 0.71rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .status-created,
        .status-initiated { background: #2e6ea9; }
        .status-processing,
        .status-pending { background: var(--pending); }
        .status-completed,
        .status-success { background: var(--success); }
        .status-failed,
        .status-cancelled,
        .status-error { background: var(--danger); }
        .status-default { background: #4a5f79; }

        .action-btn {
            border: 1px solid #c6dbf2;
            background: #eef6ff;
            color: #23496f;
            font-weight: 700;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .loading,
        .empty {
            color: var(--muted);
            padding: 26px;
            text-align: center;
        }

        @media (max-width: 1180px) {
            .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .toolbar { grid-template-columns: 1fr 1fr auto auto; }
            .toolbar .search { grid-column: 1 / -1; }
            .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 760px) {
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .toolbar { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: 1fr; }
            .event-head { grid-template-columns: 1fr; gap: 2px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>Payment History</h1>
            <p>All transaction history in one table. Click any row to expand full details under that same row.</p>
            <div class="hero-meta">
                <span class="live-dot"></span>
                <span>Real-time status monitor enabled (auto-refresh every 15 seconds)</span>
            </div>
        </section>

        <section id="statusCards" class="cards" aria-label="Status cards dashboard"></section>

        <section class="toolbar" aria-label="Search filter and actions">
            <input id="searchInput" class="search" type="search" placeholder="Search by payment ID, status, note, actor">
            <select id="statusFilter" class="select" aria-label="Filter by status">
                <option value="all">All statuses</option>
                <option value="created">Created</option>
                <option value="processing">Processing</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button id="refreshBtn" class="btn" type="button">Refresh</button>
            <button id="exportBtn" class="btn secondary" type="button">Export CSV</button>
        </section>

        <section class="panel">
            <h2>Payment History Table</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Payment ID</th>
                            <th>Account Number</th>
                            <th>Latest Status</th>
                            <th>Events</th>
                            <th>Started At</th>
                            <th>Last Updated</th>
                            <th>Processing Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const HISTORY_PATH = "/payment-history";
        const HISTORY_ENDPOINT_CANDIDATES = (() => {
            const set = new Set();

            // Preferred explicit backend
            set.add("http://localhost:8080" + HISTORY_PATH);

            // If page is served over http(s), try same-origin too.
            if (window.location.protocol !== "file:") {
                set.add(window.location.origin + HISTORY_PATH);
            }

            return Array.from(set);
        })();
        const PAYMENT_TIMELINE_ENDPOINT_CANDIDATES = HISTORY_ENDPOINT_CANDIDATES.map((endpoint) => endpoint + "/payment/");
        const REALTIME_INTERVAL_MS = 15000;

        const statusCardsEl = document.getElementById("statusCards");
        const searchInput = document.getElementById("searchInput");
        const statusFilter = document.getElementById("statusFilter");
        const refreshBtn = document.getElementById("refreshBtn");
        const exportBtn = document.getElementById("exportBtn");
        const historyTableBody = document.getElementById("historyTableBody");

        let allPayments = [];
        let filteredPayments = [];
        let expandedPaymentId = null;
        let lastSignatureByPayment = {};

        function parseTime(value) {
            if (!value) {
                return null;
            }
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? null : d;
        }

        function formatDate(value) {
            const d = parseTime(value);
            if (!d) {
                return "Unknown";
            }
            return new Intl.DateTimeFormat("en-IN", {
                year: "numeric",
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }).format(d);
        }

        function durationText(ms) {
            if (ms == null || ms < 0) {
                return "Current status";
            }
            const sec = Math.floor(ms / 1000);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;

            if (h > 0) {
                return "Spent " + h + "h " + m + "m " + s + "s";
            }
            if (m > 0) {
                return "Spent " + m + "m " + s + "s";
            }
            return "Spent " + s + "s";
        }

        function statusClass(status) {
            const s = (status || "").toLowerCase();
            const known = ["created", "initiated", "processing", "pending", "completed", "success", "failed", "cancelled", "error"];
            return known.includes(s) ? "status-" + s : "status-default";
        }

        function dotClass(status) {
            const s = (status || "").toLowerCase();
            const known = ["created", "initiated", "processing", "pending", "completed", "success", "failed", "cancelled", "error"];
            return known.includes(s) ? s : "default";
        }

        function isErrorText(note, status) {
            const text = ((note || "") + " " + (status || "")).toLowerCase();
            return text.includes("error") || text.includes("failed") || text.includes("timeout");
        }

        function normalizeEvents(rawEvents) {
            return (rawEvents || []).map((item, index) => ({
                id: item.id || "evt-" + index,
                paymentId: item.paymentId || item.payment_id || "UNKNOWN",
                accountNumber: item.accountNumber || item.account_number || "-",
                status: (item.status || "UNKNOWN").toUpperCase(),
                triggeredBy: item.triggeredBy || item.triggered_by || "SYSTEM",
                note: item.note || item.message || item.errorMessage || "",
                timestamp: item.createdAt || item.timestamp || item.eventTime || null
            }));
        }

        function groupPayments(events) {
            const map = new Map();

            for (const e of events) {
                if (!map.has(e.paymentId)) {
                    map.set(e.paymentId, []);
                }
                map.get(e.paymentId).push(e);
            }

            const result = [];
            for (const [paymentId, timeline] of map.entries()) {
                timeline.sort((a, b) => {
                    const parsedA = parseTime(a.timestamp);
                    const parsedB = parseTime(b.timestamp);
                    const ta = parsedA ? parsedA.getTime() : 0;
                    const tb = parsedB ? parsedB.getTime() : 0;
                    return ta - tb;
                });

                for (let i = 0; i < timeline.length; i++) {
                    const currentTs = parseTime(timeline[i].timestamp);
                    const nextEvent = timeline[i + 1] || null;
                    const nextTs = nextEvent ? parseTime(nextEvent.timestamp) : null;
                    timeline[i].durationMs = currentTs && nextTs ? nextTs.getTime() - currentTs.getTime() : null;
                    timeline[i].nextStatus = nextEvent ? nextEvent.status : null;
                }

                const first = timeline[0];
                const last = timeline[timeline.length - 1];
                const firstTime = first ? parseTime(first.timestamp) : null;
                const lastTime = last ? parseTime(last.timestamp) : null;
                const totalMs = firstTime && lastTime ? lastTime.getTime() - firstTime.getTime() : null;

                const failedEvent = [...timeline].reverse().find((ev) => {
                    const st = (ev.status || "").toLowerCase();
                    return st === "failed" || st === "error" || st === "cancelled" || isErrorText(ev.note, ev.status);
                }) || null;

                result.push({
                    paymentId,
                    accountNumber: first ? (first.accountNumber || "-") : "-",
                    latestStatus: last ? last.status : "UNKNOWN",
                    startedAt: first ? first.timestamp : null,
                    updatedAt: last ? last.timestamp : null,
                    eventsCount: timeline.length,
                    processingMs: totalMs,
                    failedEvent,
                    events: timeline,
                    justUpdated: false
                });
            }

            result.sort((a, b) => {
                const parsedA = parseTime(a.updatedAt);
                const parsedB = parseTime(b.updatedAt);
                const ta = parsedA ? parsedA.getTime() : 0;
                const tb = parsedB ? parsedB.getTime() : 0;
                return tb - ta;
            });

            return result;
        }

        function buildSignatureMap(payments) {
            const signatures = {};
            for (const p of payments) {
                signatures[p.paymentId] = p.latestStatus + "|" + (p.updatedAt || "");
            }
            return signatures;
        }

        function markRealtimeChanges(payments, prev, next) {
            for (const p of payments) {
                const oldSig = prev[p.paymentId];
                const newSig = next[p.paymentId];
                p.justUpdated = Boolean(oldSig && oldSig !== newSig);
            }
        }

        function normalizeStatus(status) {
            return String(status || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "_");
        }

        function isCompletedStatus(status) {
            const s = normalizeStatus(status);
            return ["completed", "success", "succeeded", "successful", "done", "settled"].includes(s);
        }

        function isFailedStatus(status) {
            const s = normalizeStatus(status);
            return ["failed", "error", "cancelled", "canceled", "rejected", "declined"].includes(s);
        }

        function isProcessingStatus(status) {
            const s = normalizeStatus(status);
            if (!s) {
                return false;
            }
            return !isCompletedStatus(s) && !isFailedStatus(s);
        }

        function renderCards(payments) {
            const total = payments.length;
            const completed = payments.filter((p) => isCompletedStatus(p.latestStatus)).length;
            const processing = payments.filter((p) => isProcessingStatus(p.latestStatus)).length;
            const failed = payments.filter((p) => isFailedStatus(p.latestStatus)).length;
            const avgMs = payments.length
                ? Math.floor(payments.reduce((acc, p) => acc + (p.processingMs || 0), 0) / payments.length)
                : 0;

            statusCardsEl.innerHTML = ""
                + "<article class='card'><div class='k'>Total Payments</div><div class='v'>" + total + "</div></article>"
                + "<article class='card'><div class='k'>Completed</div><div class='v'>" + completed + "</div></article>"
                + "<article class='card'><div class='k'>Processing</div><div class='v'>" + processing + "</div></article>"
                + "<article class='card'><div class='k'>Failed</div><div class='v'>" + failed + "</div></article>"
                + "<article class='card'><div class='k'>Avg Processing</div><div class='v'>" + (avgMs ? durationText(avgMs).replace("Spent ", "") : "N/A") + "</div></article>";
        }

        function detailHtml(payment) {
            const failedBox = payment.failedEvent
                ? "<section class='failed-box'><h3>Failed Payment Details</h3>"
                    + "<div><strong>Status:</strong> " + payment.failedEvent.status + "</div>"
                    + "<div><strong>Time:</strong> " + formatDate(payment.failedEvent.timestamp) + "</div>"
                    + "<div><strong>Triggered By:</strong> " + payment.failedEvent.triggeredBy + "</div>"
                    + "<div><strong>Reason:</strong> " + (payment.failedEvent.note || "No error note provided") + "</div>"
                    + "</section>"
                : "";

            const timeline = payment.events.map((ev) => {
                const noteClass = isErrorText(ev.note, ev.status) ? "error" : "note";
                const noteBlock = ev.note ? "<div class='" + noteClass + "'>" + ev.note + "</div>" : "";
                const transition = ev.nextStatus
                    ? "<div class='transition'>" + ev.status + " <span class='arrow'></span> " + ev.nextStatus + "</div>"
                    : "";

                return "<li class='event'>"
                    + "<span class='dot " + dotClass(ev.status) + "'></span>"
                    + "<div class='event-head'>"
                    + "<span class='state'>" + ev.status + "</span>"
                    + "<span class='stamp'>" + formatDate(ev.timestamp) + "</span>"
                    + "<span class='duration'>" + durationText(ev.durationMs) + "</span>"
                    + "</div>"
                    + "<div class='meta'><span class='pill'>Triggered by: " + ev.triggeredBy + "</span></div>"
                    + noteBlock
                    + transition
                    + "</li>";
            }).join("");

            return ""
                + "<section class='detail-box'>"
                + "<section class='detail-grid'>"
                + "<article class='kv'><div class='k'>Payment ID</div><div class='v id'>" + payment.paymentId + "</div></article>"
                + "<article class='kv'><div class='k'>Account Number</div><div class='v id'>" + (payment.accountNumber || "-") + "</div></article>"
                + "<article class='kv'><div class='k'>Latest Status</div><div class='v'><span class='status-chip " + statusClass(payment.latestStatus) + "'>" + payment.latestStatus + "</span></div></article>"
                + "<article class='kv'><div class='k'>Started At</div><div class='v'>" + formatDate(payment.startedAt) + "</div></article>"
                + "<article class='kv'><div class='k'>Last Updated</div><div class='v'>" + formatDate(payment.updatedAt) + "</div></article>"
                + "<article class='kv'><div class='k'>Total Events</div><div class='v'>" + payment.eventsCount + "</div></article>"
                + "<article class='kv'><div class='k'>Processing Time</div><div class='v'>" + (payment.processingMs == null ? "N/A" : durationText(payment.processingMs).replace("Spent ", "")) + "</div></article>"
                + "</section>"
                + failedBox
                + "<ol class='timeline'>" + timeline + "</ol>"
                + "</section>";
        }

        function renderTable(payments) {
            if (!payments.length) {
                historyTableBody.innerHTML = "<tr><td colspan='8' class='empty'>No records for current filter.</td></tr>";
                return;
            }

            if (expandedPaymentId && !payments.some((p) => p.paymentId === expandedPaymentId)) {
                expandedPaymentId = null;
            }

            const rows = [];
            for (const p of payments) {
                const selected = p.paymentId === expandedPaymentId;
                const summaryClass = "summary-row" + (selected ? " selected" : "") + (p.justUpdated ? " updated" : "");
                rows.push(
                    "<tr class='" + summaryClass + "' data-id='" + p.paymentId + "'>"
                    + "<td class='id'>" + p.paymentId + "</td>"
                    + "<td class='id'>" + (p.accountNumber || "-") + "</td>"
                    + "<td><span class='status-chip " + statusClass(p.latestStatus) + "'>" + p.latestStatus + "</span></td>"
                    + "<td>" + p.eventsCount + "</td>"
                    + "<td>" + formatDate(p.startedAt) + "</td>"
                    + "<td>" + formatDate(p.updatedAt) + "</td>"
                    + "<td>" + (p.processingMs == null ? "N/A" : durationText(p.processingMs).replace("Spent ", "")) + "</td>"
                    + "<td><button type='button' class='action-btn' data-open='" + p.paymentId + "'>" + (selected ? "Hide" : "View") + "</button></td>"
                    + "</tr>"
                );

                if (selected) {
                    rows.push(
                        "<tr class='detail-row' data-detail-id='" + p.paymentId + "'>"
                        + "<td class='detail-cell' colspan='8'>" + detailHtml(p) + "</td>"
                        + "</tr>"
                    );
                }
            }

            historyTableBody.innerHTML = rows.join("");
            bindRowActions();
        }

        function applyTimelineToPayment(payment, timelineEvents) {
            if (!timelineEvents.length) {
                return;
            }

            timelineEvents.sort((a, b) => {
                const parsedA = parseTime(a.timestamp);
                const parsedB = parseTime(b.timestamp);
                const ta = parsedA ? parsedA.getTime() : 0;
                const tb = parsedB ? parsedB.getTime() : 0;
                return ta - tb;
            });

            for (let i = 0; i < timelineEvents.length; i++) {
                const currentTs = parseTime(timelineEvents[i].timestamp);
                const nextEvent = timelineEvents[i + 1] || null;
                const nextTs = nextEvent ? parseTime(nextEvent.timestamp) : null;
                timelineEvents[i].durationMs = currentTs && nextTs ? nextTs.getTime() - currentTs.getTime() : null;
                timelineEvents[i].nextStatus = nextEvent ? nextEvent.status : null;
            }

            const first = timelineEvents[0];
            const last = timelineEvents[timelineEvents.length - 1];
            const firstTime = first ? parseTime(first.timestamp) : null;
            const lastTime = last ? parseTime(last.timestamp) : null;

            payment.accountNumber = first ? (first.accountNumber || payment.accountNumber || "-") : (payment.accountNumber || "-");
            payment.latestStatus = last ? last.status : payment.latestStatus;
            payment.startedAt = first ? first.timestamp : payment.startedAt;
            payment.updatedAt = last ? last.timestamp : payment.updatedAt;
            payment.eventsCount = timelineEvents.length;
            payment.processingMs = firstTime && lastTime ? lastTime.getTime() - firstTime.getTime() : payment.processingMs;
            payment.events = timelineEvents;
            payment.failedEvent = [...timelineEvents].reverse().find((ev) => {
                const st = (ev.status || "").toLowerCase();
                return st === "failed" || st === "error" || st === "cancelled" || isErrorText(ev.note, ev.status);
            }) || null;
        }

        async function refreshPaymentTimeline(paymentId) {
            let response = null;
            let lastError = null;

            for (const base of PAYMENT_TIMELINE_ENDPOINT_CANDIDATES) {
                const endpoint = base + encodeURIComponent(paymentId);
                try {
                    response = await fetch(endpoint);
                    if (response.ok) {
                        break;
                    }
                    lastError = new Error("API " + response.status + " at " + endpoint);
                } catch (error) {
                    lastError = error;
                }
            }

            if (!response || !response.ok) {
                throw lastError || new Error("No reachable payment timeline endpoint");
            }

            const rawTimeline = await response.json();
            const timelineEvents = normalizeEvents(rawTimeline).filter((ev) => ev.paymentId === paymentId);
            if (!timelineEvents.length) {
                return;
            }

            const payment = allPayments.find((p) => p.paymentId === paymentId);
            if (payment) {
                applyTimelineToPayment(payment, timelineEvents);
            }
        }

        function bindRowActions() {
            const clickableRows = historyTableBody.querySelectorAll(".summary-row");
            clickableRows.forEach((row) => {
                row.addEventListener("click", async (event) => {
                    const target = event.target;
                    const paymentId = row.getAttribute("data-id");

                    if (target instanceof HTMLElement && target.closest("button[data-open]")) {
                        event.preventDefault();
                    }

                    if (expandedPaymentId === paymentId) {
                        expandedPaymentId = null;
                    } else {
                        expandedPaymentId = paymentId;
                        try {
                            await refreshPaymentTimeline(paymentId);
                        } catch (error) {
                            console.warn("Could not refresh payment timeline for " + paymentId + ":", error.message);
                        }
                    }

                    renderTable(filteredPayments);
                });
            });
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const selectedStatus = statusFilter.value.toLowerCase();

            filteredPayments = allPayments.filter((p) => {
                const searchHit = term === ""
                    || p.paymentId.toLowerCase().includes(term)
                    || (p.accountNumber || "").toLowerCase().includes(term)
                    || p.latestStatus.toLowerCase().includes(term)
                    || p.events.some((ev) => {
                        const note = (ev.note || "").toLowerCase();
                        const actor = (ev.triggeredBy || "").toLowerCase();
                        return ev.status.toLowerCase().includes(term) || note.includes(term) || actor.includes(term);
                    });

                const statusHit = selectedStatus === "all"
                    || p.latestStatus.toLowerCase() === selectedStatus
                    || p.events.some((ev) => ev.status.toLowerCase() === selectedStatus);

                return searchHit && statusHit;
            });

            renderCards(filteredPayments);
            renderTable(filteredPayments);
        }

        function exportCsv() {
            if (!filteredPayments.length) {
                return;
            }

            const header = [
                "payment_id",
                "account_number",
                "latest_status",
                "events",
                "started_at",
                "updated_at",
                "processing_time_seconds",
                "failed_reason"
            ];

            const rows = filteredPayments.map((p) => {
                const sec = p.processingMs == null ? "" : Math.floor(p.processingMs / 1000);
                const reason = p.failedEvent ? p.failedEvent.note : "";
                return [
                    p.paymentId,
                    p.accountNumber || "",
                    p.latestStatus,
                    p.eventsCount,
                    p.startedAt || "",
                    p.updatedAt || "",
                    sec,
                    reason.replace(/\"/g, "\"\"")
                ];
            });

            const csv = [header, ...rows]
                .map((row) => row.map((value) => '"' + String(value ?? "") + '"').join(","))
                .join("\n");

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "payment-history-export.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function loadHistory(isRealtimeTick) {
            if (!isRealtimeTick) {
                historyTableBody.innerHTML = "<tr><td colspan='8' class='loading'>Loading payment history...</td></tr>";
            }

            let rawData = [];
            try {
                let response = null;
                let lastError = null;

                for (const endpoint of HISTORY_ENDPOINT_CANDIDATES) {
                    try {
                        response = await fetch(endpoint);
                        if (response.ok) {
                            break;
                        }
                        lastError = new Error("API " + response.status + " at " + endpoint);
                    } catch (error) {
                        lastError = error;
                    }
                }

                if (!response || !response.ok) {
                    throw lastError || new Error("No reachable payment-history endpoint");
                }

                rawData = await response.json();
            } catch (error) {
                console.error("Failed to load payment history from backend:", error.message);
                historyTableBody.innerHTML = "<tr><td colspan='8' class='empty'>Unable to fetch data from backend. Check if Spring Boot API is running and reachable.</td></tr>";
                statusCardsEl.innerHTML = "";
                allPayments = [];
                filteredPayments = [];
                return;
            }

            const events = normalizeEvents(rawData);
            const nextPayments = groupPayments(events);

            const prevSig = lastSignatureByPayment;
            const nextSig = buildSignatureMap(nextPayments);
            markRealtimeChanges(nextPayments, prevSig, nextSig);

            lastSignatureByPayment = nextSig;
            allPayments = nextPayments;
            applyFilters();
        }

        searchInput.addEventListener("input", applyFilters);
        statusFilter.addEventListener("change", applyFilters);
        refreshBtn.addEventListener("click", () => loadHistory(false));
        exportBtn.addEventListener("click", exportCsv);

        loadHistory(false);
        setInterval(() => {
            loadHistory(true);
        }, REALTIME_INTERVAL_MS);
    </script>
</body>
</html>
