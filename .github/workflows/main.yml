name: Spring Boot CI

on:
	push:
		branches: [ main ]
	pull_request:
		branches: [ main ]

jobs:
	build:
		runs-on: ubuntu-latest

		defaults:
			run:
				working-directory: paymentsystem

		steps:
			- uses: actions/checkout@v4

			- uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: '21'
					cache: maven

			- name: Make mvnw executable
				run: chmod +x mvnw

			- name: Run Unit Tests
				run: ./mvnw -B test

			- name: Package Application
				run: ./mvnw -B package -DskipTests

			- name: Upload Artifact
				uses: actions/upload-artifact@v4
				with:
					name: springboot-jar
					path: paymentsystem/target/*.jar

			- name: Login to Docker Hub
				if: github.event_name == 'push' && github.ref == 'refs/heads/main'
				uses: docker/login-action@v3
				with:
					username: ${{ secrets.DOCKER_USERNAME }}
					password: ${{ secrets.DOCKER_PASSWORD }}

			- name: Build Docker Image
				if: github.event_name == 'push' && github.ref == 'refs/heads/main'
				run: docker build -t ${{ secrets.DOCKER_USERNAME }}/springboot-jdbc-demo:latest -f paymentsystem/Dockerfile paymentsystem

			- name: Push Docker Image
				if: github.event_name == 'push' && github.ref == 'refs/heads/main'
				run: docker push ${{ secrets.DOCKER_USERNAME }}/springboot-jdbc-demo:latest
